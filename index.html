<meta id="tc-light" name="theme-color" content="#fff7ee" media="(prefers-color-scheme: light)">
<meta id="tc-dark" name="theme-color" content="#1e1714" media="(prefers-color-scheme: dark)">
<!-- Apply the saved theme before first paint so there is no flash of the wrong colors. -->
<script>
window.applyTheme = function (t) {
  var root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  var light = '#fff7ee', dark = '#1e1714';
  document.getElementById('tc-light').content = t === 'dark' ? dark : light;
  document.getElementById('tc-dark').content = t === 'light' ? light : dark;
};
(function () {
  var saved = null;
  try { saved = localStorage.getItem('chat_theme'); } catch (e) {}
  window.applyTheme(saved);
})();
</script>

<style>

      --surface: #2a201b;
      --surface-glass: rgba(42, 32, 27, .78);
      --text: #f6ebe0;
      --muted: #b9a696;
      --border: #3f3128;
      --accent: #ff8a6b;
      --accent-2: #ffb35c;
      --accent-grad: linear-gradient(135deg, #ff8a6b 0%, #ffb35c 100%);
      --accent-ink: #ff9d82;
      --accent-text: #2b1810;
      --focus-ring: rgba(255, 138, 107, .35);
      --assistant-bg: #35281f;
      --error-bg: #4a2420;
      --error-text: #ffb8ab;
      --warn-bg: #45301a;
      --warn-text: #ffd39e;
      --info-bg: #27382a;
      --info-text: #c1e4c6;
      --blob-peach: #6b3f22;
      --blob-coral: #7a3428;
      --blob-sage: #2f4a33;
      --shadow: 0 6px 22px rgba(0, 0, 0, .4);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1714;
    --surface: #2a201b;
    --surface-glass: rgba(42, 32, 27, .78);
    --text: #f6ebe0;
    --muted: #b9a696;
    --border: #3f3128;
    --accent: #ff8a6b;
    --accent-2: #ffb35c;
    --accent-grad: linear-gradient(135deg, #ff8a6b 0%, #ffb35c 100%);
    --accent-ink: #ff9d82;
    --accent-text: #2b1810;
    --focus-ring: rgba(255, 138, 107, .35);
    --assistant-bg: #35281f;
    --error-bg: #4a2420;
    --error-text: #ffb8ab;
    --warn-bg: #45301a;
    --warn-text: #ffd39e;
    --info-bg: #27382a;
    --info-text: #c1e4c6;
    --blob-peach: #6b3f22;
    --blob-coral: #7a3428;
    --blob-sage: #2f4a33;
    --shadow: 0 6px 22px rgba(0, 0, 0, .4);

  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* --app-height follows the visible area, so the iPhone keyboard never covers the composer. */
  html, body { margin: 0; height: var(--app-height, 100%); overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  /* 16px or larger stops iPhone Safari from zooming in when a field is tapped. */
  input, select, textarea { font-size: 16px; }
  button {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 16px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, filter .15s ease;
  }
  @media (pointer: coarse) {
    button, select { min-height: 44px; }
  }
  button:hover:not(:disabled):not(.link) { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  button:active:not(:disabled):not(.link) { transform: scale(.96); box-shadow: none; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent-grad); color: var(--accent-text); border-color: transparent; box-shadow: var(--shadow); }
  button.primary:hover:not(:disabled) { filter: brightness(1.05); box-shadow: var(--shadow); }
  button.link { background: none; border: none; padding: 0; color: var(--accent-ink); font-weight: 800; border-radius: 6px; }
  button.link:hover { text-decoration: underline; }
  a.button {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 16px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.button:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  a.button:active { transform: scale(.96); }
  @media (pointer: coarse) { a.button { min-height: 44px; } }
  .fine-print { font-size: 12px; color: var(--muted); text-align: center; }
  input, select, textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 9px 12px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }
  button:focus-visible, a.button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .theme-toggle {
    width: 40px;
    height: 40px;
    padding: 0;
    display: inline-grid;
    place-items: center;
    font-size: 18px;
    line-height: 1;
    flex: none;
  }
  @media (pointer: coarse) { .theme-toggle { width: 44px; height: 44px; } }

  @keyframes bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } 60% { transform: translateY(-4px); } }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes dots {
    0%, 60%, 100% { box-shadow: 0 0 var(--dot), 14px 0 var(--dot), 28px 0 var(--dot); }
    15% { box-shadow: 0 -6px var(--dot), 14px 0 var(--dot), 28px 0 var(--dot); }
    30% { box-shadow: 0 0 var(--dot), 14px -6px var(--dot), 28px 0 var(--dot); }
    45% { box-shadow: 0 0 var(--dot), 14px 0 var(--dot), 28px -6px var(--dot); }
  }

  /* Loading */
  #loading {
    height: 100%;
    display: grid;
    place-items: center;
    color: var(--muted);
    padding: 16px;
    text-align: center;
  }

  /* Login */
  .login {
    position: relative;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding:
      max(16px, env(safe-area-inset-top, 0px))
      max(16px, env(safe-area-inset-right, 0px))
      max(16px, env(safe-area-inset-bottom, 0px))
      max(16px, env(safe-area-inset-left, 0px));
  }
  /* Soft blurred blobs behind the card. */
  .login::before, .login::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(48px);
    opacity: .85;
    pointer-events: none;
  }
  .login::before {
    width: 320px; height: 320px;
    top: -90px; left: -80px;
    background: radial-gradient(circle at 35% 35%, var(--blob-coral), var(--blob-peach) 70%);
  }
  .login::after {
    width: 300px; height: 300px;
    bottom: -90px; right: -70px;
    background: radial-gradient(circle at 60% 40%, var(--blob-sage), var(--blob-peach) 80%);
  }
  .card {
    position: relative;
    z-index: 1;
    margin: auto;
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card .theme-toggle { position: absolute; top: 12px; right: 12px; }
  .mascot { font-size: 48px; line-height: 1; text-align: center; animation: bounce 1.8s ease-in-out infinite; }
  .card h1 { margin: 0; font-size: 24px; font-weight: 800; text-align: center; }
  .card p { margin: 0; }
  #login-subtitle { text-align: center; }
  .card label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .card input { color: var(--text); font-weight: 400; }
  .card .primary { padding: 11px; }
  .muted { color: var(--muted); }
  .message { font-size: 14px; border-radius: 14px; padding: 8px 12px; }
  .message:empty { display: none; }
  .message.error { background: var(--error-bg); color: var(--error-text); }
  .message.info { background: var(--info-bg); color: var(--info-text); }
  .toggle-row { font-size: 14px; text-align: center; }

  /* Chat layout */
  .chat { height: 100%; display: flex; flex-direction: column; }
  header {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "brand controls account";
    align-items: center;
    gap: 8px 16px;
    padding:
      calc(10px + env(safe-area-inset-top, 0px))
      max(16px, env(safe-area-inset-right, 0px))
      10px
      max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface-glass);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    backdrop-filter: blur(14px) saturate(1.3);
    border-bottom: 1px solid var(--border);
  }
  .brand { grid-area: brand; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; white-space: nowrap; }
  .brand-badge {
    display: inline-grid;
    place-items: center;
    width: 32px; height: 32px;
    border-radius: 12px;
    background: var(--accent-grad);
    box-shadow: var(--shadow-sm);
    font-size: 16px;
  }
  .brand-name {
    background: var(--accent-grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .controls { grid-area: controls; display: flex; gap: 8px; min-width: 0; }
  .controls select { flex: 1 1 auto; min-width: 0; max-width: 440px; }
  .account { grid-area: account; display: flex; align-items: center; gap: 10px; min-width: 0; }
  #user-email {
    color: var(--muted);
    font-size: 13px;
    max-width: 24ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    header {
      grid-template-columns: 1fr auto;
      grid-template-areas: "brand account" "controls controls";
    }
    #user-email { display: none; }
    header { column-gap: 8px; }
    .account { gap: 6px; }
    .account button:not(.theme-toggle), .account a.button { padding-left: 12px; padding-right: 12px; }
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
  }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty-emoji { font-size: 64px; line-height: 1.1; margin-bottom: 8px; display: inline-block; transform-origin: 70% 80%; animation: wobble 2.4s ease-in-out infinite; }
  .empty strong { display: block; color: var(--text); font-size: 20px; font-weight: 800; margin-bottom: 4px; }

  .msg { display: flex; flex-direction: column; max-width: 85%; animation: pop .28s ease-out both; }
  .msg.user { align-self: flex-end; align-items: flex-end; transform-origin: 100% 100%; }
  .msg.assistant {
    align-self: flex-start;
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 8px;
    align-items: start;
    transform-origin: 0 100%;
  }
  .msg.assistant::before {
    content: "🤖";
    grid-column: 1;
    grid-row: 1 / span 2;
    display: grid;
    place-items: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--info-bg);
    box-shadow: var(--shadow-sm);
    font-size: 17px;
    line-height: 1;
  }
  .msg.assistant > .bubble, .msg.assistant > .caption { grid-column: 2; }
  .bubble {
    padding: 10px 15px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .bubble { background: var(--accent-grad); color: var(--accent-text); font-weight: 600; border-bottom-right-radius: 6px; }
  .msg.assistant .bubble { background: var(--assistant-bg); border: 1px solid var(--border); border-top-left-radius: 6px; }
  /* "Thinking…" stays in the DOM for screen readers; sighted users see bouncing dots. */
  .bubble.thinking { --dot: var(--accent); font-size: 0; line-height: 0; color: transparent; padding: 18px 18px 14px; }
  .bubble.thinking::after {
    content: "";
    display: block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin: 0 36px 0 0;
    animation: dots 1.2s ease-in-out infinite;
    box-shadow: 0 0 var(--dot), 14px 0 var(--dot), 28px 0 var(--dot);
  }
  .caption { font-size: 12px; color: var(--muted); margin-top: 3px; padding: 0 6px; }

  .note {
    align-self: center;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    max-width: 100%;
    text-align: center;
    box-shadow: var(--shadow-sm);
    animation: pop .28s ease-out both;
  }
  .note.error { background: var(--error-bg); color: var(--error-text); }
  .note.error::before { content: "😵 "; }
  .note.warn { background: var(--warn-bg); color: var(--warn-text); }
  .note.warn::before { content: "🌤️ "; }

  /* Floating pill composer */
  #composer {
    display: flex;
    gap: 6px;
    align-items: flex-end;
    width: min(780px, calc(100% - max(16px, env(safe-area-inset-left, 0px)) - max(16px, env(safe-area-inset-right, 0px))));
    margin: 4px auto calc(14px + env(safe-area-inset-bottom, 0px));
    padding: 5px 5px 5px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow);
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  #composer:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 4px var(--focus-ring); }
  /* While the on-screen keyboard is up, the home-indicator gap isn't needed. */
  :root.kb #composer { margin-bottom: 10px; }
  #input {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 200px;
    padding: 10px 8px;
    border: none;
    border-radius: 18px;
    background: transparent;
    box-shadow: none;
    line-height: 1.4;
  }
  #input:focus { box-shadow: none; }
  #send { flex: none; width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; font-size: 17px; line-height: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="loading">Loading…</div>

<div id="login-view" class="login" hidden>
  <form id="login-form" class="card" novalidate>
    <button id="theme-toggle-login" class="theme-toggle" type="button"></button>
    <div class="mascot" aria-hidden="true">👋</div>
    <h1>Free Chatbot</h1>
    <p id="login-subtitle" class="muted">Log in to start chatting.</p>
    <label>Email
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    </label>
    <button id="login-submit" type="submit" class="primary">Log in</button>
    <p id="login-message" class="message" role="status"></p>
    <p class="toggle-row">
      <span id="toggle-text" class="muted">No account yet?</span>
      <button id="mode-toggle" type="button" class="link">Create an account</button>
    </p>
    <p class="fine-print">Chats are saved to your account, and the admin can read them.</p>
  </form>
</div>

<div id="chat-view" class="chat" hidden>
  <header>
    <div class="brand"><span class="brand-badge" aria-hidden="true">💬</span><span class="brand-name">Free Chatbot</span></div>
    <div class="controls">
      <select id="model" aria-label="Model"></select>
      <button id="retry-models" type="button" hidden>Retry</button>
      <button id="new-chat" type="button">New chat</button>
    </div>
    <div class="account">
      <a id="admin-link" class="button" href="admin.html" hidden>Admin</a>
      <span id="user-email"></span>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
      <button id="logout" type="button">Log out</button>
    </div>
  </header>
  <div id="messages" role="log" aria-live="polite">
    <div id="thread" class="thread"></div>
  </div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
    <button id="send" type="submit" class="primary" aria-label="Send">➤</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://qkqwvhtwcmkbjtmelkfi.supabase.co';
// Publishable key: safe to ship in the page. The OpenRouter key lives only in the Edge Function.
const SUPABASE_KEY = 'sb_publishable_uf9SDtY2gHE-0RS1dUATKw_ed2LMSDT';
const CHAT_URL = SUPABASE_URL + '/functions/v1/chat';
const MODELS_URL = 'https://openrouter.ai/api/v1/models';
const MODEL_STORAGE_KEY = 'chat_model';
// "auto" lets the server pick a free model (and switch if one is busy).
const AUTO = 'auto';
const AUTO_LABEL_FREE = 'Auto · picks a free model for you';
const AUTO_LABEL_ASSIGNED = 'Auto · picks a model for you';
const THEME_STORAGE_KEY = 'chat_theme';
// Classifiers that can't chat; never offered.
const NOT_CHAT = /(safety|guard|moderation)/i;
// On a website (not a double-clicked file) email links can come straight back to this page.
const HOSTED = location.protocol === 'https:' || location.protocol === 'http:';
// Phones: Return adds a new line and the Send button sends.
const IS_TOUCH = window.matchMedia?.('(pointer: coarse)').matches ?? false;

const $ = (id) => document.getElementById(id);

let messages = [];        // conversation sent to the model: [{ role, content }]
let sessionId = null;     // current conversation id in chat_messages
let currentUserId = null;
let controller = null;    // AbortController while a reply is streaming
let autoModel = null;     // model Auto used last, so a conversation keeps the same model
let assignedModels = [];  // extra models the admin gave this user, on top of every free model
let signUpMode = false;

// ---------- small helpers ----------

function loadSetting(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function saveSetting(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

function newId() {
  if (window.crypto?.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

// ---------- theme (Auto follows the device; Light and Dark override it) ----------

const THEMES = [
  { id: 'auto', icon: '🌗', label: 'Auto' },
  { id: 'light', icon: '☀️', label: 'Light' },
  { id: 'dark', icon: '🌙', label: 'Dark' },
];
let themeIndex = Math.max(0, THEMES.findIndex((t) => t.id === loadSetting(THEME_STORAGE_KEY)));

function showTheme() {
  const current = THEMES[themeIndex];
  const next = THEMES[(themeIndex + 1) % THEMES.length];
  window.applyTheme(current.id);
  for (const btn of document.querySelectorAll('.theme-toggle')) {
    const text = `Theme: ${current.label}. Tap to switch to ${next.label}.`;
    btn.textContent = current.icon;
    btn.title = text;
    btn.setAttribute('aria-label', text);
  }
}
for (const btn of document.querySelectorAll('.theme-toggle')) {
  btn.addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % THEMES.length;
    saveSetting(THEME_STORAGE_KEY, THEMES[themeIndex].id);
    showTheme();
  });
}
showTheme();

class ChatError extends Error {
  constructor(status, message) {
    super(message);
    this.status = status;
  }
}

// ---------- startup ----------

// iPhone: size the app to the visible area so the keyboard never hides the header or composer.
function fitViewport() {
  const vv = window.visualViewport;
  const root = document.documentElement;
  const stick = isNearBottom();
  root.style.setProperty('--app-height', (vv ? vv.height : window.innerHeight) + 'px');
  root.classList.toggle('kb', !!vv && window.innerHeight - vv.height > 120);
  if (vv) window.scrollTo(0, 0);
  if (stick) scrollToBottom();
}
window.visualViewport?.addEventListener('resize', fitViewport);
window.addEventListener('resize', fitViewport);
fitViewport();

// A confirmation link that failed (e.g. expired) comes back with the reason in the URL.
const linkError = new URLSearchParams(location.hash.slice(1)).get('error_description');
if (linkError) {
  setLoginMessage(linkError + ' Log in, or sign up again for a new link.', 'error');
  history.replaceState(null, '', location.pathname);
}

if (!window.supabase) {
  $('loading').textContent = "Couldn't load Supabase. Check your internet connection and reload the page.";
  throw new Error('supabase-js failed to load');
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Fires once on load (INITIAL_SESSION) and on every login, logout and token refresh.
// Supabase calls must not be awaited inside this callback, so defer the work.
sb.auth.onAuthStateChange((_event, session) => {
  setTimeout(() => showFor(session), 0);
});

loadModels();

async function showFor(session) {
  $('loading').hidden = true;
  const user = session?.user ?? null;

  if (!user) {
    // Supabase can repeat "signed out" events; don't wipe a half-typed password.
    if (currentUserId === null && !$('login-view').hidden) return;
    currentUserId = null;
    sessionId = null;
    controller?.abort();
    clearChat();
    $('chat-view').hidden = true;
    $('login-view').hidden = false;
    $('password').value = '';
    $('email').focus();
    return;
  }

  if (user.id === currentUserId) return;  // token refresh, nothing to redraw
  currentUserId = user.id;
  $('login-view').hidden = true;
  $('chat-view').hidden = false;
  $('user-email').textContent = user.email ?? '';
  $('user-email').title = user.email ?? '';
  $('admin-link').hidden = true;
  // Ask the server for the current user record: the admin flag can be newer than the saved session.
  sb.auth.getUser().then(({ data }) => {
    $('admin-link').hidden = data.user?.app_metadata?.is_admin !== true;
  });
  sb.from('user_models').select('model').then(({ data }) => {
    assignedModels = (data ?? []).map((r) => r.model);
    loadModels();
  });
  await loadHistory();
  $('input').focus();
}

// ---------- login ----------

function setMode(signUp) {
  signUpMode = signUp;
  $('login-submit').textContent = signUp ? 'Sign up' : 'Log in';
  $('login-subtitle').textContent = signUp ? 'Create an account to start chatting.' : 'Log in to start chatting.';
  $('toggle-text').textContent = signUp ? 'Already have an account?' : 'No account yet?';
  $('mode-toggle').textContent = signUp ? 'Log in' : 'Create an account';
  $('password').autocomplete = signUp ? 'new-password' : 'current-password';
  $('login-submit').disabled = false;
  setLoginMessage('');
}

// The admin can close sign-ups; say so before someone makes an account that can't chat.
async function checkSignupsOpen() {
  const { data } = await sb.from('app_settings').select('signups_closed_at').maybeSingle();
  if (signUpMode && data?.signups_closed_at) {
    setLoginMessage("Sign-ups are closed right now. New accounts can't chat until the admin opens them again.", 'error');
    $('login-submit').disabled = true;
  }
}

function setLoginMessage(text, kind = 'info') {
  const el = $('login-message');
  el.textContent = text;
  el.className = 'message ' + kind;
}

function friendlyAuthError(err) {
  const code = err?.code ?? '';
  const msg = err?.message ?? String(err);
  if (code === 'invalid_credentials' || /invalid login credentials/i.test(msg)) return 'Wrong email or password.';
  if (code === 'email_not_confirmed' || /not confirmed/i.test(msg)) return 'Please confirm your email first. Check your inbox for the link.';
  if (code === 'user_already_exists' || /already registered/i.test(msg)) return 'That email already has an account. Log in instead.';
  if (code === 'signup_disabled' || /signups not allowed/i.test(msg)) return 'New sign-ups are turned off.';
  if (err?.status === 429 || /rate limit|too many/i.test(msg)) return 'Too many attempts. Please wait a few minutes and try again.';
  return msg;
}

$('mode-toggle').addEventListener('click', () => {
  setMode(!signUpMode);
  if (signUpMode) checkSignupsOpen();
});

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) return setLoginMessage('Enter your email and password.', 'error');
  if (signUpMode && password.length < 6) return setLoginMessage('Password must be at least 6 characters.', 'error');

  setLoginMessage('');
  $('login-submit').disabled = true;
  try {
    if (signUpMode) {
      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: HOSTED ? { emailRedirectTo: location.origin + location.pathname } : undefined,
      });
      if (error) throw error;
      if (!data.session) {
        setMode(false);
        setLoginMessage(HOSTED
          ? 'Check your email and tap the confirmation link. It opens this page and logs you in.'
          : 'Check your email and click the confirmation link. It may open a page that fails to load; that is fine. Then come back here and log in.');
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    setLoginMessage(friendlyAuthError(err), 'error');
  } finally {
    $('login-submit').disabled = false;
  }
});

$('logout').addEventListener('click', () => sb.auth.signOut());

// ---------- free models ----------

// Everyone gets the free models. Models the admin assigned (paid ones too) come on top.
function filterModels(list, assigned) {
  const isChat = (m) => {
    const out = m.architecture?.output_modalities;
    return !Array.isArray(out) || out.includes('text');
  };
  return (list ?? [])
    .filter((m) => typeof m?.id === 'string' && isChat(m))
    .filter((m) => assigned.includes(m.id) || (m.id.endsWith(':free') && !NOT_CHAT.test(m.id)))
    .sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
}

function formatContext(n) {
  if (!n) return '? ctx';
  return n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M ctx` : `${Math.round(n / 1000)}K ctx`;
}

// Auto is always available (the server keeps its own list); specific models are added once loaded.
async function loadModels() {
  const select = $('model');
  const wanted = select.value || loadSetting(MODEL_STORAGE_KEY) || AUTO;
  select.replaceChildren(new Option(assignedModels.length ? AUTO_LABEL_ASSIGNED : AUTO_LABEL_FREE, AUTO));
  $('retry-models').hidden = true;

  try {
    const res = await fetch(MODELS_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const models = filterModels((await res.json()).data, assignedModels);
    select.append(...models.map((m) => new Option(`${m.name || m.id} · ${formatContext(m.context_length)}${m.id.endsWith(':free') ? '' : ' · paid'}`, m.id)));
  } catch {
    $('retry-models').hidden = false;  // Auto still works; Retry loads the specific models
  }
  select.value = [...select.options].some((o) => o.value === wanted) ? wanted : AUTO;
  updateSendState();
}

$('model').addEventListener('change', (e) => saveSetting(MODEL_STORAGE_KEY, e.target.value));
$('retry-models').addEventListener('click', loadModels);

// ---------- chat rendering ----------

function clearChat() {
  messages = [];
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.innerHTML = '<div class="empty-emoji" aria-hidden="true">✨</div><strong>Hi there! What shall we chat about?</strong>Free models are used by default, so chatting doesn\'t cost anything.';
  $('thread').replaceChildren(empty);
}

function isNearBottom() {
  const el = $('messages');
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}

function scrollToBottom() {
  const el = $('messages');
  el.scrollTop = el.scrollHeight;
}

function addBubble(role, text, model) {
  $('thread').querySelector('.empty')?.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  if (model) setCaption(row, model);
  $('thread').appendChild(row);
  return { row, bubble };
}

function setCaption(row, text) {
  let cap = row.querySelector('.caption');
  if (!cap) {
    cap = document.createElement('div');
    cap.className = 'caption';
    row.appendChild(cap);
  }
  cap.textContent = text;
}

function showNote(text, kind = 'error') {
  $('thread').querySelector('.empty')?.remove();
  const note = document.createElement('div');
  note.className = 'note ' + kind;
  note.textContent = text;
  $('thread').appendChild(note);
  scrollToBottom();
}

// ---------- history (Supabase, protected by row-level security) ----------

async function loadHistory() {
  clearChat();
  sessionId = newId();

  const { data: latest, error } = await sb
    .from('chat_messages')
    .select('session_id')
    .order('id', { ascending: false })
    .limit(1);
  if (error) return showNote("Couldn't load your previous chat.", 'warn');
  if (!latest.length) return;

  const sid = latest[0].session_id;
  const { data: rows, error: rowsError } = await sb
    .from('chat_messages')
    .select('role, content, model')
    .eq('session_id', sid)
    .order('id');
  if (rowsError) return showNote("Couldn't load your previous chat.", 'warn');

  sessionId = sid;
  for (const r of rows) {
    messages.push({ role: r.role, content: r.content });
    addBubble(r.role, r.content, r.model);
  }
  autoModel = rows.filter((r) => r.role === 'assistant' && r.model).at(-1)?.model ?? null;
  scrollToBottom();
}

async function saveTurn(sid, userText, reply, model) {
  const { error } = await sb.from('chat_messages').insert([
    { session_id: sid, role: 'user', content: userText },
    { session_id: sid, role: 'assistant', content: reply, model },
  ]);
  if (error && sid === sessionId) showNote("Couldn't save this message.", 'warn');
}

$('new-chat').addEventListener('click', () => {
  controller?.abort();
  clearChat();
  sessionId = newId();
  $('input').focus();
});

// ---------- sending and streaming ----------

async function readErrorMessage(res) {
  try {
    const body = await res.json();
    return body?.error?.message || body?.message || body?.msg || res.statusText;
  } catch {
    return res.statusText || `Request failed (${res.status}).`;
  }
}

function friendlyChatError(err) {
  if (err instanceof ChatError) {
    if (err.status === 401) return 'Your session expired. Please log out and log in again.';
    if (err.status === 429) {
      if (/per-day|per day/i.test(err.message)) return "Today's free message limit is used up. It's shared by everyone using this chatbot and resets at midnight UTC.";
      if (/per-min/i.test(err.message)) return 'Too many messages in the last minute. Wait a moment and try again.';
      return 'The free models are busy right now. Wait a moment and try again.';
    }
    if (err.status === 402) return 'The OpenRouter account behind this app has a negative balance, so even free models are blocked right now.';
    return err.message || `Request failed (${err.status}).`;
  }
  return "Couldn't reach the server. Check your internet connection.";
}

function setStreaming(on) {
  $('send').textContent = on ? '■' : '➤';
  $('send').setAttribute('aria-label', on ? 'Stop' : 'Send');
  updateSendState();
}

function updateSendState() {
  $('send').disabled = !controller && !$('model').value;
}

async function send(text) {
  const model = $('model').value;
  if (!text || !model || controller) return;

  const sid = sessionId;
  messages.push({ role: 'user', content: text });
  const userRow = addBubble('user', text).row;
  const { row, bubble } = addBubble('assistant', 'Thinking…');
  bubble.classList.add('thinking');
  scrollToBottom();

  controller = new AbortController();
  setStreaming(true);

  let reply = '';
  let usedModel = model;
  let errorText = null;
  let aborted = false;

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new ChatError(401, 'Not logged in.');

    const res = await fetch(CHAT_URL, {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + session.access_token,
        apikey: SUPABASE_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ model, prefer: model === AUTO ? autoModel : undefined, messages }),
      signal: controller.signal,
    });
    if (!res.ok) throw new ChatError(res.status, await readErrorMessage(res));

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    read: while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let newline;
      while ((newline = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, newline).trim();
        buffer = buffer.slice(newline + 1);
        if (!line.startsWith('data:')) continue;  // blank lines and ": OPENROUTER PROCESSING" comments

        const payload = line.slice(5).trim();
        if (payload === '[DONE]') {
          reader.cancel().catch(() => {});
          break read;
        }

        let chunk;
        try { chunk = JSON.parse(payload); } catch { continue; }
        if (chunk.error) throw new ChatError(chunk.error.code, chunk.error.message);
        if (chunk.model) usedModel = chunk.model;

        const delta = chunk.choices?.[0]?.delta?.content;
        if (delta) {
          const stick = isNearBottom();
          if (!reply) bubble.classList.remove('thinking');
          reply += delta;
          bubble.textContent = reply;
          if (stick) scrollToBottom();
        }
      }
    }
  } catch (err) {
    if (err?.name === 'AbortError') aborted = true;
    else errorText = friendlyChatError(err);
  } finally {
    controller = null;
    setStreaming(false);
  }

  // "New chat" or logout happened while streaming: keep the old chat's record, leave the screen alone.
  if (sid !== sessionId) {
    if (reply && currentUserId) saveTurn(sid, text, reply, usedModel);
    return;
  }

  if (reply) {
    messages.push({ role: 'assistant', content: reply });
    if (model === AUTO) autoModel = usedModel;
    bubble.classList.remove('thinking');
    setCaption(row, (model === AUTO ? 'Auto · ' : '') + usedModel + (aborted ? ' · stopped' : ''));
    if (errorText) showNote(errorText);
    saveTurn(sid, text, reply, usedModel);
  } else {
    // Nothing arrived: undo the turn and give the text back so it can be resent.
    messages.pop();
    row.remove();
    userRow.remove();
    if (!messages.length) clearChat();
    if (!aborted) showNote(errorText ?? 'The model sent an empty reply. Try again or pick another model.');
    $('input').value = text;
    autosize();
  }
  $('input').focus();
}

// ---------- composer ----------

function autosize() {
  const el = $('input');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight + 2, 200) + 'px';
}

$('input').addEventListener('input', autosize);

$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !IS_TOUCH) {
    e.preventDefault();
    $('composer').requestSubmit();
  }
});

$('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  if (controller) {
    controller.abort();
    return;
  }
  const text = $('input').value.trim();
  if (!text || !$('model').value) return;
  $('input').value = '';
  autosize();
  send(text);
});

clearChat();
</script>
</body>
</html>
