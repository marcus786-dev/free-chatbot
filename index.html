<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta id="tc-light" name="theme-color" content="#fff7ee" media="(prefers-color-scheme: light)">
<meta id="tc-dark" name="theme-color" content="#1e1714" media="(prefers-color-scheme: dark)">
<!-- Apply the saved theme, accent, text size and language before first paint so nothing flashes. -->
<script>
window.applyTheme = function (t) {
  var root = document.documentElement;
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  var light = '#fff7ee', dark = '#1e1714';
  document.getElementById('tc-light').content = t === 'dark' ? dark : light;
  document.getElementById('tc-dark').content = t === 'light' ? light : dark;
};
(function () {
  var s = {};
  try { s = JSON.parse(localStorage.getItem('chat_settings') || '{}') || {}; } catch (e) {}
  var root = document.documentElement;
  var theme = s.theme;
  if (!theme) { try { theme = localStorage.getItem('chat_theme'); } catch (e) {} }
  window.applyTheme(theme);
  if (s.accent) root.dataset.accent = s.accent;
  if (s.textSize) root.dataset.size = s.textSize;
  if (s.density) root.dataset.density = s.density;
  root.dataset.motion = s.reduceMotion ? 'reduce' : 'normal';
  root.dataset.showmodel = s.showModel === false ? '0' : '1';
  var lang = s.language;
  if (lang !== 'da' && lang !== 'en') {
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    lang = /^da\b/i.test(prefs[0]) ? 'da' : 'en';
  }
  root.lang = lang;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;600;700;800&family=Lora:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Comic+Neue:wght@400;700&family=Roboto+Mono:wght@400;600;700&display=swap">
<!-- iPhone "Add to Home Screen": opens full screen like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chatbot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<title>Free Chatbot</title>
</head>
<body>

<div id="loading" data-i18n="loading">Loading…</div>

<div id="login-view" class="login" hidden>
  <form id="login-form" class="card" novalidate>
    <button id="lang-toggle-login" class="lang-toggle" type="button" data-i18n-title="switch_language" data-i18n-aria="switch_language"></button>
    <button id="theme-toggle-login" class="theme-toggle" type="button"></button>
    <div class="mascot" aria-hidden="true">👋</div>
    <h1>Free Chatbot</h1>
    <p id="login-subtitle" class="muted"></p>
    <label><span data-i18n="email">Email</span>
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label><span data-i18n="password">Password</span>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    </label>
    <button id="login-submit" type="submit" class="primary"></button>
    <p id="login-message" class="message" role="status"></p>
    <p class="toggle-row">
      <span id="toggle-text" class="muted"></span>
      <button id="mode-toggle" type="button" class="link"></button>
    </p>
    <p class="fine-print" data-i18n="login_fine_print">Chats are saved to your account, and the admin can read them.</p>
    <p class="fine-print"><a href="privacy.html">Privacy Policy</a></p>
  </form>
</div>

<div id="chat-view" class="app" hidden>
  <div id="backdrop" class="backdrop" hidden></div>

  <aside id="sidebar" class="sidebar" aria-label="Sidebar" data-i18n-aria="sidebar">
    <div class="sb-top">
      <div class="brand"><span class="brand-badge" aria-hidden="true">💬</span><span class="brand-name">Free Chatbot</span></div>
      <button id="sb-collapse" class="icon-btn plain" type="button" data-i18n-aria="close_sidebar" data-i18n-title="close_sidebar">«</button>
    </div>
    <button id="new-chat" class="primary new-chat" type="button" data-i18n="new_chat">＋ New chat</button>
    <div class="search">
      <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search_ph" data-i18n-aria="search">
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-btn-chats" type="button" role="tab" aria-controls="tab-chats" aria-selected="true" data-i18n="tab_chats">💬 Chats</button>
      <button id="tab-btn-skills" type="button" role="tab" aria-controls="tab-skills" aria-selected="false" tabindex="-1" data-i18n="tab_skills">🎭 Skills</button>
      <button id="tab-btn-tools" type="button" role="tab" aria-controls="tab-tools" aria-selected="false" tabindex="-1" data-i18n="tab_tools">🧰 Tools</button>
    </div>
    <div class="sb-body">
      <div id="tab-chats" role="tabpanel" aria-labelledby="tab-btn-chats"><div id="chat-list"></div></div>
      <div id="tab-skills" role="tabpanel" aria-labelledby="tab-btn-skills" hidden></div>
      <div id="tab-tools" role="tabpanel" aria-labelledby="tab-btn-tools" hidden></div>
    </div>
    <div class="sb-foot">
      <div class="who"><span aria-hidden="true">👤</span><span id="user-email"></span></div>
      <div class="foot-row">
        <button id="open-settings" type="button" data-i18n="settings_btn">⚙ Settings</button>
        <button id="theme-toggle" class="theme-toggle" type="button"></button>
        <span class="grow"></span>
        <a id="admin-link" class="button" href="admin.html" hidden data-i18n="admin">Admin</a>
        <button id="logout" type="button" data-i18n="logout">Log out</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="sb-open" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="false" data-i18n-aria="open_sidebar" data-i18n-title="open_sidebar">☰</button>
      <div class="title-wrap">
        <h1 id="chat-title" tabindex="0"></h1>
        <span id="skill-chip" hidden></span>
      </div>
      <div class="model-wrap">
        <select id="model" data-i18n-aria="model"></select>
        <button id="retry-models" type="button" hidden data-i18n="retry">Retry</button>
      </div>
    </header>
    <div id="messages" role="log" aria-live="polite">
      <div id="thread" class="thread"></div>
    </div>
    <div id="composer-area">
      <div id="composer-chips" class="composer-chips" hidden></div>
      <form id="composer">
        <textarea id="input" rows="1" maxlength="8000" data-i18n-placeholder="message_ph" data-i18n-aria="message"></textarea>
        <button id="mic" type="button" class="tool-toggle" aria-pressed="false" data-i18n-aria="voice" data-i18n-title="voice">🎤</button>
        <button id="web-toggle" type="button" class="tool-toggle" aria-pressed="false" hidden>🌐</button>
        <button id="send" type="submit" class="primary" aria-label="Send" data-i18n-aria="send">➤</button>
      </form>
      <div id="char-count" aria-live="polite"></div>
      <div class="chat-footer"><a href="privacy.html">Privacy Policy</a></div>
    </div>
  </div>
</div>

<dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
  <div class="dlg-head">
    <h2 id="settings-title" data-i18n="settings">Settings</h2>
    <span id="saved-ind" class="saved-ind" role="status"></span>
    <button id="settings-close" class="icon-btn" type="button" data-i18n-aria="close" data-i18n-title="close">✕</button>
  </div>
  <div class="set-wrap">
    <nav id="set-nav" class="set-nav" aria-label="Settings"></nav>
    <div id="set-body" class="set-body"></div>
  </div>
</dialog>

<dialog id="skill-dialog" aria-labelledby="skill-title">
  <form id="skill-form" novalidate>
    <div class="dlg-head">
      <h2 id="skill-title"></h2>
      <button id="skill-close" class="icon-btn" type="button" data-i18n-aria="close" data-i18n-title="close">✕</button>
    </div>
    <div class="dlg-body">
      <div class="field-row">
        <label class="field narrow"><span data-i18n="skill_emoji">Emoji</span>
          <input name="emoji" maxlength="12" autocomplete="off">
        </label>
        <label class="field"><span data-i18n="skill_name">Name</span>
          <input name="name" maxlength="60" required autocomplete="off">
        </label>
      </div>
      <label class="field"><span data-i18n="skill_desc">Short description</span>
        <input name="description" maxlength="200" autocomplete="off">
      </label>
      <label class="field"><span data-i18n="skill_instructions">Instructions</span>
        <textarea name="instructions" maxlength="4000" rows="7" data-i18n-placeholder="skill_instructions_ph"></textarea>
        <span id="skill-count" class="counter"></span>
        <span class="hint" data-i18n="skill_instructions_hint">The AI follows these in every message of the chat. You don't see them in the conversation.</span>
      </label>
      <label class="field"><span data-i18n="skill_model">Preferred model</span>
        <select name="model"></select>
      </label>
      <div class="field"><span data-i18n="skill_tools">Default tools</span>
        <div id="skill-tools"></div>
      </div>
    </div>
    <div class="dlg-foot">
      <button id="skill-cancel" type="button" data-i18n="cancel">Cancel</button>
      <button id="skill-save" type="submit" class="primary" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>
<input id="skill-file" type="file" accept=".json,application/json" hidden>
<div id="print-area" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/util.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/markdown.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/settings.js"></script>
<script defer src="js/skills.js"></script>
<script defer src="js/sidebar.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
